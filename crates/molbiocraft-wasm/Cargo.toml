[package]
name = "molbiocraft-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Zero-import WebAssembly RPC gateway exposing the complete MolBioCraft Rust bioinformatics workspace to React/TypeScript"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
molbiocraft-core = { path = "../molbiocraft-core" }
molbiocraft-formats = { path = "../molbiocraft-formats" }
molbiocraft-align = { path = "../molbiocraft-align" }
molbiocraft-phylo = { path = "../molbiocraft-phylo" }
molbiocraft-cloning = { path = "../molbiocraft-cloning" }
molbiocraft-protein = { path = "../molbiocraft-protein" }
serde.workspace = true
serde_json.workspace = true
bio.workspace = true
memchr.workspace = true
rustc-hash.workspace = true
