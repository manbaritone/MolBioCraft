[package]
name = "molbiocraft-desktop"
version = "1.0.0"
description = "A cross-platform bioinformatics workbench for sequence analysis in molecular biology and evolutionary biology research. Built for macOS, Windows, and Linux."
authors = ["Bundit Boonyarit"]
license = "CC-BY-NC-4.0"
edition = "2021"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rfd's gtk3 backend: Linux dialogs need neither xdg-desktop-portal nor zenity (D0212).
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
molbiocraft-core = { path = "../crates/molbiocraft-core" }
molbiocraft-formats = { path = "../crates/molbiocraft-formats" }
molbiocraft-align = { path = "../crates/molbiocraft-align" }
molbiocraft-phylo = { path = "../crates/molbiocraft-phylo" }
molbiocraft-cloning = { path = "../crates/molbiocraft-cloning" }
molbiocraft-protein = { path = "../crates/molbiocraft-protein" }
molbiocraft-wasm = { path = "../crates/molbiocraft-wasm" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent"] }

# Mirrors the root workspace's [profile.release]: src-tauri is excluded from the workspace (US-01M6P2B4).
# Cargo's `trim-paths` is not stable, so this profile leaves the build machine's source paths in
# panic locations. scripts/build_rust_wasm.mjs remaps them (`--remap-path-prefix`) for the WASM
# engine; a plain `cargo build --release` does not.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
