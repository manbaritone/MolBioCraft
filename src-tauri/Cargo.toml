[package]
name = "molbiocraft-desktop"
version = "1.0.0"
description = "A cross-platform bioinformatics workbench for sequence analysis in molecular biology and evolutionary biology research. Built for macOS, Windows, and Linux."
authors = ["Bundit Boonyarit"]
license = "CC-BY-NC-4.0"
edition = "2021"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
molbiocraft-core = { path = "../crates/molbiocraft-core" }
molbiocraft-formats = { path = "../crates/molbiocraft-formats" }
molbiocraft-align = { path = "../crates/molbiocraft-align" }
molbiocraft-phylo = { path = "../crates/molbiocraft-phylo" }
molbiocraft-cloning = { path = "../crates/molbiocraft-cloning" }
molbiocraft-protein = { path = "../crates/molbiocraft-protein" }
molbiocraft-wasm = { path = "../crates/molbiocraft-wasm" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent"] }
